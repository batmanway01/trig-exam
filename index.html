<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Тригонометрия: формулалар, теория, тесттер және шешімі көрсетілген есептер. Қазақша / по-русски.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Тригонометрия жаттықтырғышы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: notebook-grid page, sticky header, one content column (max 1080px); unit circle in the hero as the subject's signature */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --ink:#142039; --muted:#58647e; --line:#d8deea; --grid:rgba(36,70,199,.075);
  --accent:#2446c7; --accent-ink:#ffffff; --accent-soft:#e7ecfb;
  --sin:#d23c5a; --cos:#2446c7;
  --ok:#17834f; --ok-soft:#e2f3ea; --bad:#c42f47; --bad-soft:#fbe7eb; --warn:#9a6200; --warn-soft:#fcf0d8;
  --f-display:'Unbounded','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1323; --surface:#141c30; --ink:#e6ebf6; --muted:#98a4be; --line:#263150; --grid:rgba(125,151,255,.06);
  --accent:#7d97ff; --accent-ink:#0d1323; --accent-soft:#1d2849;
  --sin:#ff7d93; --cos:#7d97ff;
  --ok:#52cc8f; --ok-soft:#12301f; --bad:#ff7d8f; --bad-soft:#3a1720; --warn:#f0b54a; --warn-soft:#33270e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1323; --surface:#141c30; --ink:#e6ebf6; --muted:#98a4be; --line:#263150; --grid:rgba(125,151,255,.06);
  --accent:#7d97ff; --accent-ink:#0d1323; --accent-soft:#1d2849;
  --sin:#ff7d93; --cos:#7d97ff;
  --ok:#52cc8f; --ok-soft:#12301f; --bad:#ff7d8f; --bad-soft:#3a1720; --warn:#f0b54a; --warn-soft:#33270e;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.35rem}
h3{font-size:1.02rem;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1rem;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand svg{width:30px;height:20px}
nav.main{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.93rem;color:var(--muted);white-space:nowrap}
nav.main button.on{background:var(--accent-soft);color:var(--accent)}
nav.main button .cnt{display:inline-block;min-width:1.4em;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:.72rem;line-height:1.5}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{background:none;border:0;padding:6px 10px;font-size:.8rem;font-weight:700;font-family:var(--f-mono);color:var(--muted)}
.lang button.on{background:var(--ink);color:var(--bg)}

main{padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h1{font-size:clamp(1.75rem,4.2vw,3rem);letter-spacing:-.01em;margin-top:10px;overflow-wrap:anywhere}
.hero .lead{font-size:1.06rem;color:var(--muted);max-width:52ch;margin-top:14px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 12px;font-size:.86rem;border-radius:8px}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}

.circle-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.circle-box svg{width:100%;max-width:300px;height:auto;align-self:center;display:block}
.circle-box .read{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.circle-box .read div{background:var(--bg);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column}
.circle-box .read b{font-size:.95rem}
.circle-box input[type=range]{width:100%;accent-color:var(--accent)}
.circle-cap{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border-top:2px solid var(--ink);padding-top:8px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}

.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tcard .num{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.tcard h3{font-size:.98rem}
.tcard .sample{min-height:44px;color:var(--muted);overflow:hidden}
.tcard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.prog{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* formula list */
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.92rem}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.fcard .top .ok{color:var(--ok);font-weight:600}
.fcard .cond{font-size:.85rem;color:var(--muted)}
.note{border-radius:10px;padding:8px 10px;font-size:.86rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:75ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}

mjx-container{max-width:100%}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;margin:.35em 0 !important;padding:2px 0}
mjx-container svg{max-width:none}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.vals{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:720px;width:100%}
table.vals th,table.vals td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
table.vals th{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:600}
table.vals td:first-child,table.vals th:first-child{text-align:left;padding-left:12px;position:sticky;left:0;background:var(--surface)}

/* quiz */
.qwrap{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qcard .kind{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.qtext{font-size:1.08rem;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;min-width:0}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .let{flex-shrink:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;background:var(--surface);border:1px solid var(--line)}
.opt .body{min-width:0;overflow-x:auto;overflow-y:hidden;padding-block:4px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .let{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.exp.ok{background:var(--ok-soft)}
.exp.bad{background:var(--bad-soft)}
.exp .verdict{font-weight:700}
.exp.ok .verdict{color:var(--ok)}
.exp.bad .verdict{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums}

/* test menu */
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tbtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tbtn:hover{border-color:var(--accent)}
.tbtn b{font-family:var(--f-display);font-weight:500;font-size:1rem}
.tbtn span{font-size:.86rem;color:var(--muted)}
.tbtn.hl{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.gen{border-color:var(--accent);color:var(--accent)}
.chip.gen.on{background:var(--accent);color:var(--accent-ink)}

/* problem */
.steps{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--accent);padding-left:12px}
.step .cm{font-size:.86rem;color:var(--muted)}
.ans{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.ans .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
details.fused{background:var(--bg);border-radius:10px;padding:8px 12px}
details.fused summary{cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.hint{font-size:.86rem;color:var(--muted)}

/* flashcards */
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;cursor:pointer}
.flash .side{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash .q{font-size:1.25rem;max-width:100%;overflow-x:auto}

/* theory */
.th-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;counter-reset:th}
.th{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;min-width:0}
.th .n{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:600;flex-shrink:0;width:22px}
.th .tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.th b{font-weight:700}

/* mistakes */
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;min-width:0}
.mitem .body{min-width:0;overflow-x:auto;overflow-y:hidden;padding-block:4px}
.mitem .times{font-size:.78rem;color:var(--bad);font-weight:600;white-space:nowrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.tprog{display:flex;flex-direction:column;gap:10px}
.tprog .r{display:grid;grid-template-columns:minmax(0,1fr) 140px 56px;gap:10px;align-items:center;font-size:.9rem}
.tprog .r span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

footer{border-top:1px solid var(--line);padding-block:18px 28px;font-size:.82rem;color:var(--muted)}

@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand span{display:none}
  .fl,.th-list{grid-template-columns:minmax(0,1fr)}
  .tprog .r{grid-template-columns:minmax(0,1fr) 80px 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
<script>
window.MathJax={

};

</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Тригонометрия">
      <svg viewBox="0 0 30 20" aria-hidden="true"><path d="M1 10 C 5 0, 9 0, 11.5 10 S 18 20, 22 10 S 27 2, 29 6" fill="none" stroke="var(--sin)" stroke-width="2.2" stroke-linecap="round"/><path d="M1 10 H29" stroke="var(--line)" stroke-width="1"/></svg>

</header>

<script>
'use strict';
const R=String.raw;
const D=s=>'\\['+s+'\\]', I=s=>'\\('+s+'\\)', ID=s=>'\\(\\displaystyle '+s+'\\)';
const $=s=>document.querySelector(s);
const dsp=s=>String(s).split('\\(').join('\\(\\displaystyle ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};

/* ---------- state ---------- */
const LS='trig-kz-v1';
let S={lang:'kk',mf:{},wf:{},wt:{},wp:{},okp:{},ans:0,cor:0};
try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x&&typeof x==='object')S=Object.assign(S,x)}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const L=o=>o==null?'':(typeof o==='string'?o:(S.lang==='ru'?(o.r??o.k):o.k));

/* ---------- UI text ---------- */
const U={
  nav_home:{k:'Тақырыптар',r:'Темы'}, nav_test:{k:'Тест',r:'Тест'}, nav_prob:{k:'Есептер',r:'Задачи'}, nav_theory:{k:'Теория',r:'Теория'}, nav_mist:{k:'Қателер',r:'Ошибки'},
  eyebrow:{k:'Емтиханға дайындық · 10–11 сынып',r:'Подготовка к экзамену · 10–11 класс'},
  lead:{k:'Кітаптағы барлық формула, 32 теория тармағы және шешімі қадаммен көрсетілген есептер. Тест тапсыр, қатеңді көр, қайта жаттық.',r:'Все формулы из книги, 32 пункта теории и задачи с пошаговым решением. Проходи тест, смотри ошибки, тренируйся снова.'},
  start_test:{k:'Тест бастау',r:'Начать тест'}, solve:{k:'Есеп шығару',r:'Решать задачи'}, cards_all:{k:'Карточкалар',r:'Карточки'},
  st_f:{k:'формула',r:'формул'}, st_p:{k:'дайын есеп + генератор',r:'готовых задач + генератор'}, st_t:{k:'теория сұрағы',r:'вопросов по теории'}, st_m:{k:'формула меңгерілді',r:'формул освоено'},
  topics:{k:'Тақырыптар',r:'Темы'}, topics_sub:{k:'Кітаптағы ретпен. Әр тақырыпта формулалар, тест және есептер бар.',r:'В порядке книги. В каждой теме формулы, тест и задачи.'},
  formulas:{k:'Формулалар',r:'Формулы'}, test:{k:'Тест',r:'Тест'}, problems:{k:'Есептер',r:'Задачи'},
  mastered:{k:'меңгерілді',r:'освоено'}, back:{k:'← Барлық тақырыптар',r:'← Все темы'},
  topic_test:{k:'Тақырып тесті',r:'Тест по теме'}, topic_probs:{k:'Тақырып есептері',r:'Задачи по теме'},
  cond:{k:'Шарты',r:'Условие'}, extra:{k:'Кітап суретінде жоқ, бірақ керек',r:'Нет на фото книги, но нужно'},
  attention:{k:'Назар аудар',r:'Внимание'},

/* unit circle */
let ucTimer=null,ucAuto=true,ucA=30;
function quadOf(a){a=((a%360)+360)%360;if(a%90===0)return 0;return Math.floor(a/90)+1}
function drawCircle(a){
  const svg=document.getElementById('uc');if(!svg)return;
  const t=a*Math.PI/180,c=Math.cos(t),s=Math.sin(t);
  const px=c,py=-s;
  const lg=Math.abs(a)>180?1:0;
  const arcR=.28,ax=arcR*Math.cos(t),ay=-arcR*Math.sin(t);
  const q=quadOf(a);
  const ql=['I','II','III','IV'];const qp=[[.75,-.95],[-.75,-.95],[-.75,1.05],[.75,1.05]];
  svg.innerHTML=`
   <g stroke="var(--line)" stroke-width=".012"><line x1="-1.35" y1="0" x2="1.35" y2="0"/><line x1="0" y1="-1.3" x2="0" y2="1.3"/></g>
   ${ql.map((l,i)=>`<text x="${qp[i][0]}" y="${qp[i][1]}" font-size=".14" text-anchor="middle" font-family="JetBrains Mono, monospace" fill="${q===i+1?'var(--accent)':'var(--muted)'}" font-weight="${q===i+1?700:500}">${l}</text>`).join('')}
   <circle cx="0" cy="0" r="1" fill="none" stroke="var(--ink)" stroke-width=".018"/>
   ${a>0&&a<360?`<path d="M ${arcR} 0 A ${arcR} ${arcR} 0 ${lg} 0 ${ax} ${ay}" fill="none" stroke="var(--muted)" stroke-width=".014"/>`:''}
   <line x1="0" y1="0" x2="${px}" y2="0" stroke="var(--cos)" stroke-width=".05" stroke-linecap="round"/>
   <line x1="${px}" y1="0" x2="${px}" y2="${py}" stroke="var(--sin)" stroke-width=".05" stroke-linecap="round"/>
   <line x1="0" y1="0" x2="${px}" y2="${py}" stroke="var(--ink)" stroke-width=".02"/>
   <circle cx="${px}" cy="${py}" r=".055" fill="var(--ink)"/>
   <text x="1.38" y="-.05" font-size=".12" text-anchor="end" fill="var(--muted)" font-family="JetBrains Mono, monospace">x</text>
   <text x=".05" y="-1.22" font-size=".12" fill="var(--muted)" font-family="JetBrains Mono, monospace">y</text>`;
  const f=v=>(Math.abs(v)<5e-4?0:v).toFixed(3).replace('-0.000','0.000');
  const tg=Math.abs(c)<1e-9?'—':f(s/c);
  $('#uc-read').innerHTML=`
   <div><span>α</span><b>${Math.round(a)}°</b></div>
   <div style="color:var(--cos)"><span>cos α</span><b>${f(c)}</b></div>
   <div style="color:var(--sin)"><span>sin α</span><b>${f(s)}</b></div>
   <div><span>tg α</span><b>${tg}</b></div>`;
}
function startCircle(){
  const inp=document.getElementById('ang');if(!inp)return;
  inp.value=Math.round(ucA);drawCircle(ucA);
  inp.addEventListener('input',()=>{ucAuto=false;ucA=+inp.value;drawCircle(ucA)});
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(ucAuto&&!reduce){
    let last=performance.now();
    const tick=now=>{if(!ucAuto||!document.getElementById('uc'))return;ucA=(ucA+(now-last)*0.012)%360;last=now;inp.value=Math.round(ucA);drawCircle(ucA);ucTimer=requestAnimationFrame(tick)};
    ucTimer=requestAnimationFrame(tick);
  }
}
function stopCircle(){if(ucTimer)cancelAnimationFrame(ucTimer);ucTimer=null}

/* ---------- quiz builders ---------- */
function uniqTake(cands,correct,n){
  const out=[];const seen=new Set([correct]);
  for(const c of cands){const key=c==null?'∅':c;if(!seen.has(key)&&!seen.has(c)){seen.add(key);out.push(c)}if(out.length>=n)break}
  return out;
}
function mkQ(kind,prompt,correct,wrongs,exp,ref,render){
  const opts=shuffle([correct,...wrongs]);
  return {kind,prompt,opts:opts.map(render),ci:opts.indexOf(correct),exp,ref};
}
const rTex=x=>x==null?esc(u('undef')):ID(x);
function formulaQ(f){
  const pool=F.filter(x=>x.id!==f.id);
  const sib=pool.filter(x=>x.g===f.g);
  let rev=Math.random()<.3;
  const build=rev=>{
    if(!rev){
      const c=[...shuffle(f.tr||[]).slice(0,2),...shuffle(sib.filter(x=>x.l!==f.l).map(x=>x.r)),...shuffle(pool.filter(x=>x.l!==f.l).map(x=>x.r))];
      return {p:D(f.l+'=\\;?'),cor:f.r,w:uniqTake(c,f.r,3),k:u('q_cont')};
    }
    const c=[...shuffle(sib.filter(x=>x.r!==f.r).map(x=>x.l)),...shuffle(pool.filter(x=>x.r!==f.r&&x.g===f.g).map(x=>x.l))];
    return {p:D('?\\;='+f.r),cor:f.l,w:uniqTake(c,f.l,3),k:u('q_start')};
  };
  let b=build(rev);if(b.w.length<3)b=build(false);
  const exp=`<div><b>${esc(L(GI[f.g]))}</b>${f.n?' · '+esc(L(f.n)):''}</div>${D(fFull(f))}${f.c?`<div class="cond">${u('cond')}: ${I(f.c)}</div>`:''}${f.w?`<div class="note warn">${L(f.w)}</div>`:''}`;
  return mkQ(u('k_formula'),`<div class="qtext">${b.k}</div>${b.p}`,b.cor,b.w,exp,{t:'f',id:f.id},ID);
}

  return mkQ(u('k_theory'),`<div class="qtext">${L(x.q)}</div>`,correct,opts.slice(1),exp,{t:'t',id:x.id},dsp);

function valueQ(){
  const fn=pick(['sin','cos','tg','ctg','sin','cos']);const i=rnd(ANG.length);
  const deg=Math.random()<.5;
  const arg=deg?ANG[i][0]+'^\\circ':ANG[i][1];
  const cor=VAL[fn][i];
  const cands=shuffle([...new Set(VAL[fn].filter(v=>v!==cor))].concat(shuffle(VPOOL)));
  const w=uniqTake(cands,cor,3);
  const pr=`\\${fn}\\,${arg}`;
  const exp=`${D(pr+'='+(cor==null?'\\text{—}':cor))}${cor==null?`<div>${u('undef')}: ${fn==='tg'?I(R`\cos\alpha=0`):I(R`\sin\alpha=0`)}</div>`:''}<div class="muted">${ANG[i][0]}° = ${I(ANG[i][1])}</div>`;
  return mkQ(u('k_value'),`<div class="qtext">${u('q_val')}</div>${D(pr+'=\\;?')}`,cor,w,exp,{t:'v'},rTex);
}
function invQ(){
  const fn=pick(Object.keys(INV));const [v,ang]=pick(INV[fn]);
  const cor=piT(ang[0],ang[1]);
  const pool=[...new Set(Object.values(INV).flat().map(x=>piT(x[1][0],x[1][1])))];
  const cands=shuffle(INV[fn].map(x=>piT(x[1][0],x[1][1]))).concat(shuffle(pool));
  const w=uniqTake(cands,cor,3);
  const pr=`\\${fn}${par(v)}`;
  const exp=`${D(pr+'='+cor)}<div class="muted">\\(\\${fn}\\,a\\in${INVR[fn]}\\)</div>`;
  return mkQ(u('k_inv'),`<div class="qtext">${u('q_val')}</div>${D(pr+'=\\;?')}`,cor,w,exp,{t:'v'},ID);
}
function signQ(){
  const ru=S.lang==='ru';
  const combos=ru?['все четыре','только sin','tg и ctg','только cos']:['төртеуі де','тек sin','tg және ctg','тек cos'];
  const roman=['I','II','III','IV'];
  const v=rnd(3);
  if(v===0){
    const q=rnd(4);
    return mkQ(u('k_sign'),`<div class="qtext">${roman[q]} ${u('quarter')}: ${u('quad_q')}</div>`,combos[q],combos.filter((_,i)=>i!==q),`<div>${ru?'Знаки по четвертям: I — все +, II — sin +, III — tg, ctg +, IV — cos +.':'Ширектер бойынша: I — бәрі +, II — sin +, III — tg, ctg +, IV — cos +.'}</div>`,{t:'v'},o=>esc(o));
  }
  if(v===1){
    const a=pick([20,35,70,100,115,160,200,215,250,290,310,345,400,-30,-120]);
    const q=quadOf(a);
    return mkQ(u('k_sign'),`<div class="qtext">${I('\\alpha='+a+'^\\circ')}. ${u('where_q')}</div>`,roman[q-1],roman.filter((_,i)=>i!==q-1),`<div>${a<0||a>=360?I(a+'^\\circ\\to'+(((a%360)+360)%360)+'^\\circ')+' · ':''}${roman[q-1]} ${u('quarter')}</div>`,{t:'v'},o=>`<span class="mono">${o}</span>`);
  }
  const q=rnd(4);const sS=q<2?'>':'<';const cS=(q===0||q===3)?'>':'<';
  return mkQ(u('k_sign'),`<div class="qtext">${I('\\sin\\alpha'+sS+'0')}, ${I('\\cos\\alpha'+cS+'0')}. ${u('where_q')}</div>`,roman[q],roman.filter((_,i)=>i!==q),`<div>${roman[q]} ${u('quarter')}</div>`,{t:'v'},o=>`<span class="mono">${o}</span>`);
}
function weightedF(list,n){
  const w=list.map(f=>({f,k:Math.random()*(S.wf[f.id]?3:S.mf[f.id]?.6:1.4)}));
  return w.sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.f);
}
function startQuiz(title,qs,kind){
  QZ={title,qs,i:0,picked:null,score:0,wrong:[],kind,done:false};
  go('quiz');
}
function quizFor(kind,g){
  if(kind==='all')return startQuiz(u('t_all'),weightedF(F,20).map(formulaQ),kind);
  if(kind==='theory')return startQuiz(u('t_theory'),shuffle(TQ).slice(0,20).map(theoryQ),kind);
  if(kind==='vals')return startQuiz(u('t_vals'),Array.from({length:15},valueQ),kind);
  if(kind==='inv')return startQuiz(u('t_inv'),Array.from({length:12},invQ),kind);
  if(kind==='sign')return startQuiz(u('t_sign'),Array.from({length:10},signQ),kind);
  if(kind==='mix'){
    const qs=[...weightedF(F,10).map(formulaQ),...shuffle(TQ).slice(0,6).map(theoryQ),...Array.from({length:4},valueQ),...Array.from({length:2},invQ),...Array.from({length:3},signQ)];
    return startQuiz(u('t_mix'),shuffle(qs),kind);
  }
  if(kind==='mist'){
    const fs=Object.keys(S.wf).map(id=>FI[id]).filter(Boolean).map(formulaQ);
    const ts=Object.keys(S.wt).map(id=>TQ.find(x=>x.id===id)).filter(Boolean).map(theoryQ);
    const qs=shuffle([...fs,...ts]);
    if(!qs.length){go('mistakes');return}
    return startQuiz(u('t_mist'),qs,kind);
  }
  if(kind==='topic'){
    const G0=GI[g];
    if(g==='values')return startQuiz(L(G0),shuffle([...Array.from({length:10},valueQ),...Array.from({length:5},signQ)]),kind+':'+g);
    let qs=shuffle(F.filter(f=>f.g===g)).map(formulaQ);
    if(g==='inverse')qs=qs.concat(Array.from({length:5},invQ));
    if(g==='parity')qs=qs.concat(Array.from({length:4},signQ));
    if(qs.length<8)qs=qs.concat(shuffle(F.filter(f=>f.g===g)).map(formulaQ));
    return startQuiz(L(G0),shuffle(qs).slice(0,15),kind+':'+g);
  }
}

function expHTML(q,ok){

function record(ref,ok){
  S.ans++;if(ok)S.cor++;
  if(ref.t==='f'){if(ok){S.mf[ref.id]=1;delete S.wf[ref.id]}else{S.wf[ref.id]=(S.wf[ref.id]||0)+1;delete S.mf[ref.id]}}
  if(ref.t==='t'){if(ok)delete S.wt[ref.id];else S.wt[ref.id]=(S.wt[ref.id]||0)+1}
  save();
}

/* ---------- problems ---------- */
const TRI=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]];
const ROM=['I','II','III','IV'];
const IVL=[R`0\lt\alpha\lt\frac{\pi}{2}`,R`\frac{\pi}{2}\lt\alpha\lt\pi`,R`\pi\lt\alpha\lt\frac{3\pi}{2}`,R`\frac{3\pi}{2}\lt\alpha\lt2\pi`];
function fr(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;if(d===1)return String(n);return(n<0?'-':'')+'\\frac{'+Math.abs(n)+'}{'+d+'}'}
function sqrtFr(n,d){const g=gcd(n,d);n/=g;d/=g;if(n===0)return'0';let m=n*d,s=1;for(let i=2;i*i<=m;i++){while(m%(i*i)===0){m/=i*i;s*=i}}const g2=gcd(s,d);s/=g2;let dd=d/g2;if(m===1)return fr(s,dd);const num=(s===1?'':s)+'\\sqrt{'+m+'}';return dd===1?num:'\\frac{'+num+'}{'+dd+'}'}
const sg=x=>x>0?{k:'оң',r:'положителен'}:{k:'теріс',r:'отрицателен'};
function genOthers(){
  let [a,b,c]=pick(TRI);if(Math.random()<.5)[a,b]=[b,a];
  const q=rnd(4)+1;const ss=q<=2?1:-1,cs=(q===1||q===4)?1:-1;
  const giveSin=Math.random()<.5;
  const sv=fr(ss*a,c),cv=fr(cs*b,c);
  const s=[];
  if(giveSin){
    s.push(R`\cos^2\alpha=1-\sin^2\alpha=1-`+`\\frac{${a*a}}{${c*c}}=\\frac{${b*b}}{${c*c}}`);
    s.push(`\\cos\\alpha=\\pm\\frac{${b}}{${c}}`);
    s.push(cm(`\\cos\\alpha=${cv}`,`${ROM[q-1]} ширекте косинус ${sg(cs).k}.`,`В ${ROM[q-1]} четверти косинус ${sg(cs).r}.`));
  }else{
    s.push(R`\sin^2\alpha=1-\cos^2\alpha=1-`+`\\frac{${b*b}}{${c*c}}=\\frac{${a*a}}{${c*c}}`);
    s.push(`\\sin\\alpha=\\pm\\frac{${a}}{${c}}`);
    s.push(cm(`\\sin\\alpha=${sv}`,`${ROM[q-1]} ширекте синус ${sg(ss).k}.`,`В ${ROM[q-1]} четверти синус ${sg(ss).r}.`));
  }
  const tg=fr(ss*cs*a,b),ctg=fr(ss*cs*b,a);
  s.push(`\\tg\\alpha=\\frac{\\sin\\alpha}{\\cos\\alpha}=${tg}`);
  s.push(`\\ctg\\alpha=\\frac{1}{\\tg\\alpha}=${ctg}`);
  const given=giveSin?`\\sin\\alpha=${sv}`:`\\cos\\alpha=${cv}`;
  const find=giveSin?`\\cos\\alpha,\\ \\tg\\alpha,\\ \\ctg\\alpha`:`\\sin\\alpha,\\ \\tg\\alpha,\\ \\ctg\\alpha`;
  return {id:'gen',f:'b1',t:'find',s,a:`${giveSin?'\\cos\\alpha='+cv:'\\sin\\alpha='+sv},\\ \\tg\\alpha=${tg},\\ \\ctg\\alpha=${ctg}`,
    q:{k:`\\(${given}\\), \\(${IVL[q-1]}\\). \\(${find}\\) мәндерін табыңыз.`,r:`\\(${given}\\), \\(${IVL[q-1]}\\). Найдите \\(${find}\\).`}};
}
function genDouble(){
  let [a,b,c]=pick(TRI);if(Math.random()<.5)[a,b]=[b,a];
  const q=rnd(4)+1;const ss=q<=2?1:-1,cs=(q===1||q===4)?1:-1;
  const sv=fr(ss*a,c),cv=fr(cs*b,c);
  const s2=fr(2*ss*cs*a*b,c*c),c2=fr(b*b-a*a,c*c),t2=fr(2*ss*cs*a*b,b*b-a*a);
  const s=[`\\cos\\alpha=\\pm\\sqrt{1-\\frac{${a*a}}{${c*c}}}=\\pm\\frac{${b}}{${c}}`,
    cm(`\\cos\\alpha=${cv}`,`${ROM[q-1]} ширекте косинус ${sg(cs).k}.`,`В ${ROM[q-1]} четверти косинус ${sg(cs).r}.`),
    `\\sin2\\alpha=2\\sin\\alpha\\cos\\alpha=2\\cdot${par(sv)}\\cdot${par(cv)}=${s2}`,
    `\\cos2\\alpha=\\cos^2\\alpha-\\sin^2\\alpha=\\frac{${b*b}}{${c*c}}-\\frac{${a*a}}{${c*c}}=${c2}`,
    `\\tg2\\alpha=\\frac{\\sin2\\alpha}{\\cos2\\alpha}=${t2}`];
  return {id:'gen',f:'d1',t:'find',s,a:`\\sin2\\alpha=${s2},\\ \\cos2\\alpha=${c2},\\ \\tg2\\alpha=${t2}`,
    q:{k:`\\(\\sin\\alpha=${sv}\\), \\(${IVL[q-1]}\\). \\(\\sin2\\alpha\\), \\(\\cos2\\alpha\\), \\(\\tg2\\alpha\\) табыңыз.`,r:`\\(\\sin\\alpha=${sv}\\), \\(${IVL[q-1]}\\). Найдите \\(\\sin2\\alpha\\), \\(\\cos2\\alpha\\), \\(\\tg2\\alpha\\).`}};
}
function genAdd(){
  let [a1,b1,c1]=pick(TRI),[a2,b2,c2]=pick(TRI);if(Math.random()<.5)[a1,b1]=[b1,a1];if(Math.random()<.5)[a2,b2]=[b2,a2];
  const sp=fr(a1*b2+b1*a2,c1*c2),cm2=fr(b1*b2+a1*a2,c1*c2);
  const s=[`\\cos\\alpha=\\sqrt{1-\\frac{${a1*a1}}{${c1*c1}}}=\\frac{${b1}}{${c1}},\\qquad \\sin\\beta=\\sqrt{1-\\frac{${b2*b2}}{${c2*c2}}}=\\frac{${a2}}{${c2}}`,
    `\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta=\\frac{${a1}}{${c1}}\\cdot\\frac{${b2}}{${c2}}+\\frac{${b1}}{${c1}}\\cdot\\frac{${a2}}{${c2}}=${sp}`,
    `\\cos(\\alpha-\\beta)=\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta=\\frac{${b1*b2}}{${c1*c2}}+\\frac{${a1*a2}}{${c1*c2}}=${cm2}`];
  return {id:'gen',f:'a1',t:'find',s,a:`\\sin(\\alpha+\\beta)=${sp},\\ \\cos(\\alpha-\\beta)=${cm2}`,
    q:{k:`\\(\\sin\\alpha=\\frac{${a1}}{${c1}}\\), \\(\\cos\\beta=\\frac{${b2}}{${c2}}\\), α мен β — I ширек бұрыштары. \\(\\sin(\\alpha+\\beta)\\) және \\(\\cos(\\alpha-\\beta)\\) табыңыз.`,
       r:`\\(\\sin\\alpha=\\frac{${a1}}{${c1}}\\), \\(\\cos\\beta=\\frac{${b2}}{${c2}}\\), α и β — углы I четверти. Найдите \\(\\sin(\\alpha+\\beta)\\) и \\(\\cos(\\alpha-\\beta)\\).`}};
}
function genHalf(){
  const [a,b,c]=pick(TRI.concat([[24,7,25]]));const pos=Math.random()<.6;const cb=pos?b:-b;
  const sh=sqrtFr(c-cb,2*c),ch=sqrtFr(c+cb,2*c);
  const cv=fr(cb,c);
  const s=[`\\sin^2\\frac{\\alpha}{2}=\\frac{1-\\cos\\alpha}{2}=\\frac{1-${par(cv)}}{2}=${fr(c-cb,2*c)}`,
    cm(`\\sin\\frac{\\alpha}{2}=${sh}`,'0 < α/2 < π/2, сондықтан оң.','0 < α/2 < π/2, поэтому положительный.'),
    `\\cos^2\\frac{\\alpha}{2}=\\frac{1+\\cos\\alpha}{2}=${fr(c+cb,2*c)}`,`\\cos\\frac{\\alpha}{2}=${ch}`];
  return {id:'gen',f:'h1',t:'find',s,a:`\\sin\\frac{\\alpha}{2}=${sh},\\ \\cos\\frac{\\alpha}{2}=${ch}`,
    q:{k:`\\(\\cos\\alpha=${cv}\\), \\(0\\lt\\alpha\\lt\\pi\\). \\(\\sin\\frac{\\alpha}{2}\\) және \\(\\cos\\frac{\\alpha}{2}\\) табыңыз.`,r:`\\(\\cos\\alpha=${cv}\\), \\(0\\lt\\alpha\\lt\\pi\\). Найдите \\(\\sin\\frac{\\alpha}{2}\\) и \\(\\cos\\frac{\\alpha}{2}\\).`}};
}
function genEq(){
  const fn=pick(['sin','cos','tg','ctg','sin','cos']);
  const map={sin:'arcsin',cos:'arccos',tg:'arctg',ctg:'arcctg'};
  const [v,A]=pick(INV[map[fn]]);
  const k=pick([1,1,2,3]);
  const kx=k===1?'x':k+'x';
  const s=[];let base,pre='',per,fid;
  const vNum=v;
  if(fn==='sin'){
    if(vNum==='0'){base=null;per=[1,1];fid='q7'}
    else if(vNum==='1'){base=[1,2];per=[2,1];fid='q6'}
    else if(vNum==='-1'){base=[-1,2];per=[2,1];fid='q5'}
    else{base=A;pre='(-1)^n';per=[1,1];fid='q1';s.push(`${kx}=(-1)^n\\arcsin${par(v)}+\\pi n`);s.push(cm(`\\arcsin${par(v)}=${piT(A[0],A[1])}`,'Кестеден.','По таблице.'))}
  }else if(fn==='cos'){
    if(vNum==='0'){base=[1,2];per=[1,1];fid='q9'}
    else if(vNum==='1'){base=null;per=[2,1];fid='q10'}
    else if(vNum==='-1'){base=[1,1];per=[2,1];fid='q8'}
    else{base=A;pre='\\pm';per=[2,1];fid='q2';s.push(`${kx}=\\pm\\arccos${par(v)}+2\\pi n`);s.push(cm(`\\arccos${par(v)}=${piT(A[0],A[1])}`,'Кестеден.','По таблице.'))}
  }else{
    base=A[0]===0?null:A;per=[1,1];fid=fn==='tg'?'q3':'q4';
    s.push(`${kx}=\\${map[fn]}${par(v)}+\\pi n`);s.push(cm(`\\${map[fn]}${par(v)}=${piT(A[0],A[1])}`,'Кестеден.','По таблице.'));
  }
  const sol=(bp,bq,pp,pq)=>{
    let left='';
    if(bp!==null){
      let b=piT(bp,bq);
      if(pre==='(-1)^n'&&b.startsWith('-')){left='(-1)^{n+1}'+b.slice(1)}
      else left=pre+b;
      return left+'+'+perT(pp,pq);
    }
    return perT(pp,pq);
  };
  const lineK=sol(base?base[0]:null,base?base[1]:1,per[0],per[1]);
  if(!s.length||fn==='sin'&&!pre||fn==='cos'&&!pre)s.push(cm(`${kx}=${lineK}`,'Жеке жағдай.','Частный случай.'));
  else s.push(`${kx}=${lineK}`);
  let ans=lineK;
  if(k>1){ans=sol(base?base[0]:null,base?base[1]*k:1,per[0],per[1]*k);s.push(cm(`x=${ans}`,`Екі жағын ${k}-ге бөлеміз.`,`Делим обе части на ${k}.`))}
  const eq=`\\${fn}${k===1?'\\,':''}${kx}=${v}`;
  return {id:'gen',f:fid,t:'solve',e:eq,s,a:`x=${ans},\\ n\\in\\mathbb{Z}`};
}
const GENS=[genOthers,genDouble,genAdd,genHalf,genEq,genEq];
function probList(f){return f==='all'?P:P.filter(p=>FI[p.f].g===f)}
function vProblems(arg){
  if(arg&&arg!==PS.f){PS.f=arg;PS.i=0;PS.step=0;PS.cur=null}

  else{PS.list=probList(f);if(PS.i>=PS.list.length)PS.i=0;p=PS.list[PS.i];idx=`${PS.i+1} / ${PS.list.length}`}
  const fo=FI[p.f];
  const stmt=p.q?`<div class="qtext">${dsp(L(p.q))}</div>`:`<div class="qtext">${u(p.t==='calc'?'calc':p.t==='simp'?'simp':'solveq')}:</div>`;
  const steps=p.s.slice(0,PS.step).map(st=>typeof st==='string'?`<div class="step">${D(st)}</div>`:`<div class="step"><div class="cm">${esc(L(st))}</div>${D(st.m)}</div>`).join('');
  const full=PS.step>=p.s.length;
  const st=f!=='gen'?(S.okp[p.id]?`<span style="color:var(--ok);font-weight:600">✓</span>`:S.wp[p.id]?`<span style="color:var(--bad);font-weight:600">✗</span>`:''):'';
  return `<section style="display:flex;flex-direction:column;gap:14px">
    <div><h2>${u('problems')}</h2><p class="muted" style="margin-top:6px">${u('solve_first')}</p></div>
    <div class="chips" role="tablist">
      <button class="chip gen ${f==='gen'?'on':''}" data-go="problems-gen">${u('gen')}</button>
      <button class="chip ${f==='all'?'on':''}" data-go="problems-all">${u('all')} (${P.length})</button>
      ${groups.map(g=>`<button class="chip ${f===g.id?'on':''}" data-go="problems-${g.id}">${String(g.i+1).padStart(2,'0')} ${esc(L(g))}</button>`).join('')}
    </div>
    <div class="qwrap" style="max-width:820px;margin:0">
      <div class="qhead"><span class="eyebrow">${esc(L(GI[fo.g]))}</span><span>${f==='gen'?u('gen_note'):idx} ${st}</span></div>
      <div class="qcard">
        ${stmt}
        ${p.e?D(p.e):''}
        <details class="fused"><summary>${u('used_f')}</summary>${D(fFull(fo))}${fo.w?`<div class="note warn">${L(fo.w)}</div>`:''}</details>
        ${PS.step?`<div class="steps">${steps}</div>`:''}
        ${full?`<div class="ans"><div class="lbl">${u('answer')}</div>${D(p.a)}</div>
          <div class="tools"><button class="btn ok" data-act="p-ok">${u('did_ok')}</button><button class="btn bad" data-act="p-bad">${u('did_bad')}</button></div>`
        :`<div class="tools"><button class="btn pri" data-act="p-step">${u('step_next')} (${PS.step+1}/${p.s.length})</button><button class="btn" data-act="p-all">${u('step_all')}</button></div>`}
      </div>
      <div class="qnav">
        ${f==='gen'?`<span></span><button class="btn pri" data-act="p-new">${u('newp')} ↻</button>`:
        `<button class="btn" data-act="p-prev" ${PS.i===0?'disabled':''}>${u('prev')}</button>
         <button class="btn" data-act="p-rand">${u('random')}</button>
         <button class="btn" data-act="p-next" ${PS.i>=PS.list.length-1?'disabled':''}>${u('nextp')}</button>`}
      </div>
    </div>
  </section>`;
}

/* ---------- theory ---------- */
function vTheory(){
  return `<section style="display:flex;flex-direction:column;gap:16px">
    <div class="sec-head" style="margin:0"><div><h2>${u('theory_title')}</h2><p class="muted" style="margin-top:6px">${u('theory_sub')}</p></div>
    <button class="btn pri" data-act="quiz" data-k="theory">${u('t_theory')} · ${u('test')}</button></div>
    <div class="th-list">${T.map((t,i)=>{const s=L(t);const j=s.indexOf(' — ');return `<div class="th"><span class="n">${i+1}</span><div class="tx"><p>${j>0?`<b>${esc(s.slice(0,j))}</b> — ${esc(s.slice(j+3))}`:esc(s)}</p>${t.m?D(t.m):''}</div></div>`}).join('')}</div>
  </section>`;
}

/* ---------- mistakes ---------- */
function vMistakes(){
  const wf=Object.entries(S.wf).filter(([id])=>FI[id]).sort((a,b)=>b[1]-a[1]);
  const wt=Object.entries(S.wt).map(([id,n])=>[TQ.find(x=>x.id===id),n]).filter(x=>x[0]);
  const wp=Object.keys(S.wp).map(id=>P.find(p=>p.id===id)).filter(Boolean);
  const any=wf.length+wt.length+wp.length;
  const acc=S.ans?Math.round(S.cor/S.ans*100):0;
  return `<section style="display:flex;flex-direction:column;gap:18px">
    <div class="sec-head" style="margin:0"><div><h2>${u('mist_title')}</h2><p class="muted" style="margin-top:6px">${S.ans} ${u('answered')} · ${u('accuracy')} ${acc}%</p></div>
      ${wf.length+wt.length?`<button class="btn pri" data-act="quiz" data-k="mist">${u('t_mist')} →</button>`:''}</div>
    ${any?'':`<div class="empty">${u('m_none')}</div>`}
    ${wf.length?`<div><h3 style="margin-bottom:10px">${u('m_f')} (${wf.length})</h3><div class="mlist">${wf.map(([id,n])=>{const f=FI[id];return `<div class="mitem"><div class="body">${ID(fFull(f))}<div class="muted" style="font-size:.8rem">${esc(L(GI[f.g]))}</div></div><span class="times">${n} ${u('times')}</span></div>`}).join('')}</div></div>`:''}
    ${wt.length?`<div><h3 style="margin-bottom:10px">${u('m_t')} (${wt.length})</h3><div class="mlist">${wt.map(([x,n])=>`<div class="mitem"><div class="body"><div>${L(x.q)}</div><div style="color:var(--ok);font-size:.9rem">✓ ${(S.lang==='ru'&&x.o.r?x.o.r:x.o.k)[0]}</div></div><span class="times">${n} ${u('times')}</span></div>`).join('')}</div></div>`:''}
    ${wp.length?`<div><h3 style="margin-bottom:10px">${u('m_p')} (${wp.length})</h3><div class="mlist">${wp.map(p=>`<div class="mitem"><div class="body">${p.q?L(p.q):u(p.t==='calc'?'calc':p.t==='simp'?'simp':'solveq')+': '+I(p.e)}</div><button class="btn sm" data-act="p-open" data-id="${p.id}">${u('open')}</button></div>`).join('')}</div></div>`:''}
    <div><h3 style="margin-bottom:10px">${u('progress')}</h3><div class="tprog">${G.filter(g=>topicStats(g.id).n).map(g=>{const st=topicStats(g.id);const pct=Math.round(st.m/st.n*100);return `<div class="r"><span>${esc(L(g))}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${st.m}/${st.n}</span></div>`}).join('')}</div></div>
    <div class="tools">${resetArm?`<button class="btn bad" data-act="reset-yes">${u('reset_sure')}</button><button class="btn" data-act="reset-no">${u('cancel')}</button>`:`<button class="btn sm" data-act="reset">${u('reset')}</button>`}</div>
  </section>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='quiz')return quizFor(b.dataset.k);
  if(a==='qtopic')return quizFor('topic',b.dataset.g);
  if(a==='q-pick'){
    if(QZ.picked!==null)return;
    const i=+b.dataset.i;QZ.picked=i;const q=QZ.qs[QZ.i];const ok=i===q.ci;
    if(ok)QZ.score++;else QZ.wrong.push(q);
    record(q.ref,ok);
    render();
    const n=document.getElementById('q-next');if(n)n.focus({preventScroll:true});
    const ex=document.getElementById('q-exp');if(ex&&ex.getBoundingClientRect().bottom>innerHeight)ex.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  if(a==='q-next'){if(QZ.i>=QZ.qs.length-1)QZ.done=true;else{QZ.i++;QZ.picked=null}render();window.scrollTo(0,0);return}
  if(a==='q-stop'){QZ.done=true;QZ.qs=QZ.qs.slice(0,QZ.i+(QZ.picked!==null?1:0))||[];if(!QZ.qs.length){QZ=null;go('test');return}render();return}
  if(a==='q-again'){const k=QZ.kind;if(k.startsWith('topic:'))return quizFor('topic',k.slice(6));return quizFor(k)}
  if(a==='q-wrong'){const qs=QZ.wrong.map(q=>({...q}));QZ={title:u('redo_wrong'),qs:shuffle(qs),i:0,picked:null,score:0,wrong:[],kind:QZ.kind,done:false};render();return}
  if(a==='flip'){FC.open=!FC.open;render();return}
  if(a==='fc-next'||a==='fc-prev'){FC.i+=a==='fc-next'?1:-1;FC.open=false;render();return}
  if(a==='fc-ok'||a==='fc-bad'){const f=FC.list[FC.i];record({t:'f',id:f.id},a==='fc-ok');if(FC.i<FC.list.length-1){FC.i++;FC.open=false}render();return}
  if(a==='p-step'){PS.step++;render();return}
  if(a==='p-all'){const p=PS.f==='gen'?PS.cur:PS.list[PS.i];PS.step=p.s.length;render();return}
  if(a==='p-ok'||a==='p-bad'){
    const p=PS.f==='gen'?PS.cur:PS.list[PS.i];
    if(PS.f!=='gen'){if(a==='p-ok'){S.okp[p.id]=1;delete S.wp[p.id]}else{S.wp[p.id]=1;delete S.okp[p.id]}}
    S.ans++;if(a==='p-ok')S.cor++;save();
    if(PS.f==='gen'){PS.cur=pick(GENS)();PS.step=0}else if(PS.i<PS.list.length-1){PS.i++;PS.step=0}
    render();window.scrollTo(0,0);return;
  }
  if(a==='p-new'){PS.cur=pick(GENS)();PS.step=0;render();return}
  if(a==='p-next'||a==='p-prev'){PS.i+=a==='p-next'?1:-1;PS.step=0;render();return}
  if(a==='p-rand'){PS.i=rnd(PS.list.length);PS.step=0;render();return}
  if(a==='p-open'){const id=b.dataset.id;const p=P.find(x=>x.id===id);PS.f='all';PS.list=P;PS.i=P.indexOf(p);PS.step=0;go('problems-all');return}
  if(a==='reset'){resetArm=true;render();return}
  if(a==='reset-no'){resetArm=false;render();return}
  if(a==='reset-yes'){resetArm=false;const lang=S.lang;S={lang,mf:{},wf:{},wt:{},wp:{},okp:{},ans:0,cor:0};save();render();return}
});
document.addEventListener('keydown',e=>{
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if((location.hash==='#quiz')&&QZ&&!QZ.done){
    const map={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};const k=e.key.toLowerCase();
    if(QZ.picked===null&&k in map){const btn=document.querySelector(`[data-act="q-pick"][data-i="${map[k]}"]`);if(btn)btn.click()}
    else if(QZ.picked!==null&&(e.key==='Enter'||e.key===' ')&&t.id!=='q-next'){e.preventDefault();const n=document.getElementById('q-next');if(n)n.click()}
  }
  if(t&&t.dataset&&t.dataset.act==='flip'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click()}
});
function setLang(l){S.lang=l;save();render()}
$('#lang-kk').addEventListener('click',()=>setLang('kk'));
$('#lang-ru').addEventListener('click',()=>setLang('ru'));

render();
</script>

</body>
</html>
